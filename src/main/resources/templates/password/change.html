<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cambiar contraseña — Bolsa</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .password-card {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>
<!-- Página autónoma, sin la barra de navegación: en el cambio forzado todos sus enlaces
     volverían aquí, y en el voluntario basta con el botón de cancelar. -->
<div class="password-card">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock fs-1 text-dark"></i>
                <h4 class="mt-2 fw-bold">Cambiar contraseña</h4>
            </div>

            <div th:if="${forced}" class="alert alert-warning py-2 small">
                Tu contraseña la ha establecido un administrador. Elige una nueva para
                empezar a usar la aplicación.
            </div>
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

            <form th:action="@{/password/change}" th:object="${form}" method="post">

                <div class="mb-3" th:unless="${forced}">
                    <label for="currentPassword" class="form-label">Contraseña actual</label>
                    <input type="password" id="currentPassword" class="form-control"
                           th:field="*{currentPassword}" autocomplete="current-password"/>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Nueva contraseña</label>
                    <input type="password" id="password" class="form-control"
                           th:field="*{password}" autocomplete="new-password" autofocus
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                    <div class="form-text">Mínimo 8 caracteres.</div>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Repite la nueva contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control"
                           th:field="*{confirmPassword}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    <i class="bi bi-check-lg me-1"></i>Guardar contraseña
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:unless="${forced}" href="/dashboard" class="small text-muted">Cancelar</a>
                <form th:if="${forced}" th:action="@{/logout}" method="post" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link btn-sm text-muted text-decoration-none">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
