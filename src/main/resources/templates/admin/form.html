<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 480px;">

    <h4 class="mb-4">
        <i class="bi bi-person-gear me-2"></i>
        <span th:text="${editId != null} ? 'Editar usuario' : 'Nuevo usuario'"></span>
    </h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${editId != null} ? @{/admin/users/{id}/edit(id=${editId})} : @{/admin/users}"
                  th:object="${form}" method="post">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control"
                           th:field="*{username}" autocomplete="off"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control"
                           th:field="*{password}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                    <div class="form-text" th:if="${editId != null}">
                        Déjala vacía para mantener la contraseña actual.
                    </div>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select class="form-select" th:field="*{role}">
                        <option th:each="r : ${roles}"
                                th:value="${r}" th:text="${r.label}"></option>
                    </select>
                    <div class="form-text">
                        Un administrador puede gestionar usuarios; no ve los datos de los demás.
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}"/>
                    <label class="form-check-label" for="enabled">Cuenta activa</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Guardar
                    </button>
                    <a href="/admin/users" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
