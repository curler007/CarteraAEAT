spring.application.name=bolsa

# SQLite
spring.datasource.url=jdbc:sqlite:bolsa.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.com.raul.bolsa=DEBUG

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.port=8080

# Semilla del primer administrador. Solo se usa en el arranque inicial, cuando aún no
# existe ningún usuario en la BD: a partir de ahí los usuarios se gestionan en /admin/users
# y cambiar estos valores no tiene ningún efecto.
# Cambia la contraseña desde la aplicación antes de exponerla en internet.
app.security.username=admin
app.security.password=changeme

# Pro
server.address=127.0.0.1
server.forward-headers-strategy=framework